name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | tail -n 1)
          PLATFORM=$(ls $ANDROID_HOME/platforms | tail -n 1)
          mkdir -p build/gen build/obj build/apk
          
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt package -f -m \
            -J build/gen -M app/src/main/AndroidManifest.xml \
            -I $ANDROID_HOME/platforms/$PLATFORM/android.jar
            
          javac -source 1.8 -target 1.8 -bootclasspath $ANDROID_HOME/platforms/$PLATFORM/android.jar \
            -d build/obj build/gen/com/lucas/googletvlauncher/R.java \
            app/src/main/java/com/lucas/googletvlauncher/MainActivity.java
            
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/d8 --output build/apk build/obj/com/lucas/googletvlauncher/*.class
          
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt package -f -M app/src/main/AndroidManifest.xml \
            -A app/src/main/assets -I $ANDROID_HOME/platforms/$PLATFORM/android.jar \
            -F build/unsigned.apk build/apk
            
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign --ks debug.keystore \
            --ks-pass pass:android --out GoogleTVLauncher.apk build/unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleTVLauncher-APK
          path: GoogleTVLauncher.apk
