name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with aapt and javac
        run: |
          mkdir -p build/gen build/obj build/apk
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort | tail -n 1)
          PLATFORM=$(find $ANDROID_HOME/platforms -maxdepth 1 -mindepth 1 | sort | tail -n 1)
          
          $BUILD_TOOLS/aapt package -f -m \
            -J build/gen -M app/src/main/AndroidManifest.xml \
            -I $PLATFORM/android.jar
            
          javac -source 1.8 -target 1.8 -bootclasspath $PLATFORM/android.jar \
            -d build/obj build/gen/com/lucas/googletvlauncher/R.java \
            app/src/main/java/com/lucas/googletvlauncher/MainActivity.java
            
          $BUILD_TOOLS/d8 --output build/apk build/obj/com/lucas/googletvlauncher/*.class
          
          $BUILD_TOOLS/aapt package -f -M app/src/main/AndroidManifest.xml \
            -A app/src/main/assets -I $PLATFORM/android.jar \
            -F build/unsigned.apk build/apk
            
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            
          $BUILD_TOOLS/apksigner sign --ks debug.keystore \
            --ks-pass pass:android --out GoogleTVLauncher.apk build/unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleTVLauncher-APK
          path: GoogleTVLauncher.apk
